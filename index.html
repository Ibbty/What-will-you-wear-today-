<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Wardrobe Roulette</title>
  <style>
    :root {
      --card-bg: rgba(255, 255, 255, 0.12);
      --accent: #ffd3b6;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(-45deg, #1a1c29, #2b1029, #112233, #1f142e);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    /* Soft moving dreamlike background */
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: var(--card-bg);
      padding: 40px 30px;
      border-radius: 30px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      max-width: 380px;
      width: 85%;
    }

    h1 { 
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 3px;
      margin-top: 0;
      margin-bottom: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.95);
    }

    .date-display {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 35px;
      letter-spacing: 2px;
    }
    
    /* Clean Vertical Outfit Display */
    .outfit-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      margin: 40px 0;
    }

    /* Giant Emoji Blocks */
    .clothing-item {
      font-size: 4.5rem; /* Huge emojis */
      line-height: 1;
      cursor: pointer;
      position: relative;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,0.15));
      user-select: none;
    }

    .clothing-item:hover {
      transform: scale(1.15);
    }

    /* Locked glow indicator instead of words */
    .clothing-item.locked {
      filter: drop-shadow(0 0 12px var(--accent)) drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }
    
    .clothing-item.locked::after {
      content: '✨';
      position: absolute;
      top: -5px;
      right: -15px;
      font-size: 1.2rem;
    }

    button {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 14px 35px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      margin-top: 20px;
    }

    button:hover { 
      background: white;
      color: #1a1c29;
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
    }
    
    button:active { transform: scale(0.97); }

    .hint-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 20px;
      letter-spacing: 0.5px;
    }

    /* Smooth swap animation */
    .swap-anim {
      animation: popEffect 0.3s ease-out;
    }

    @keyframes popEffect {
      0% { transform: scale(0.6); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Today's Look</h1>
    <div class="date-display" id="date-box">---</div>
    
    <div class="outfit-container">
      <div id="hat-layer" class="clothing-item" onclick="toggleLock(this)">🧢</div>
      <div id="top-layer" class="clothing-item" onclick="toggleLock(this)">👕</div>
      <div id="pants-layer" class="clothing-item" onclick="toggleLock(this)">👖</div>
      <div id="shoes-layer" class="clothing-item" onclick="toggleLock(this)">👟</div>
    </div>
    
    <button onclick="rollOutfit()">Randomize</button>
    <div class="hint-text">Tap any item to lock it with a sparkle</div>
  </div>

  <script>
    // Pools of only emojis
    const wardrobe = {
      hats: ["🧢", "🕵️‍♂️", "🤠", "👒", "🎩", "👑", "🪖", "🧣"],
      tops: ["👕", "👔", "🧥", "👚", "🎽", "🥼", "🥋", "sweater"], // "sweater" handles fallback nicely, but keeping to emoji strings:
      topsReal: ["👕", "👔", "🧥", "👚", "🎽", "🥼", "🦺", "🍕"], // added playful alternatives
      pants: ["👖", "🩳", "🦿", "🧦"],
      shoes: ["👟", "👞", "🥾", "👠", "🩴", "🥿", "⛸️"]
    };

    // Keep actual dynamic emoji pools fully verified
    const hats = ["🧢", "🤠", "👒", "🎩", "👑", "🪖", "⛑️"];
    const tops = ["👕", "👔", "🧥", "👚", "🎽", "🥼", "🦺"];
    const pants = ["👖", "🩳", "🧘‍♀️", "📐"]; // structural fallbacks
    const pantsFixed = ["👖", "🩳", "👖", "🩳"]; 
    const shoes = ["👟", "👞", "🥾", "👠", "🩴"];

    function toggleLock(element) {
      element.classList.toggle('locked');
    }

    function getRandomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function applyLayerUpdate(elementId, emojiArray) {
      const el = document.getElementById(elementId);
      if (el.classList.contains('locked')) return;

      el.classList.remove('swap-anim');
      void el.offsetWidth; 
      el.classList.add('swap-anim');

      el.innerText = getRandomItem(emojiArray);
    }

    function rollOutfit() {
      applyLayerUpdate("hat-layer", hats);
      applyLayerUpdate("top-layer", tops);
      applyLayerUpdate("pants-layer", pantsFixed);
      applyLayerUpdate("shoes-layer", shoes);
    }

    // Modern clean date logic
    const options = { month: 'short', day: 'numeric' };
    document.getElementById("date-box").innerText = new Date().toLocaleDateString('en-US', options);

    // Roll immediately on open
    rollOutfit();
  </script>

</body>
</html>


  </script>

</body>
</html>
